[Dataset]
data_dir=data/recsys_data
dataset=ml-1m
min_user_per_item=5
min_item_per_user=15

# leave-k-out
leave_k=5
popularity_order=true

[Evaluator]
;ks=[10, 20, 50, 100]
ks=[1, 5, 10, 20]
# ks=[1, 5, 10]

[EarlyStop]
;10, 15, 25
;20 bc
early_stop=5
early_stop_measure=mean

[Experiment]
;38 for yelp, 72 for amazon cds, change num of epochs in different datasets
;num_epochs=38
num_epochs=10
;num_epochs=1
verbose=0
print_step=1
test_step=1
test_from=0
# MultVAE / LOCA_VAE / MF / MOE / NeuralRecommender / RRL / autoencoder
model_name=RRL
;seed=2023
gpu=0
node_id=0
num_nodes=2
device_id=[0, 1]